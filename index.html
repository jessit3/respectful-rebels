<!doctype html>
<!--
  FREEBIE APP TEMPLATE (FEA Build-a-thon, Session 5)
  A quiz, assessment, diagnostic, calculator or generator with the opt-in built in:
  welcome screen -> questions (or number steps) -> "building your plan" -> teaser + opt-in box -> full results.
  Do not edit this file by hand. Fill a config JSON (see references/app-config.md) and run
  scripts/build_app.py, which drops the config in below and checks it.
  URL options once it's live:
    ?r=<result key>   opens that full result straight away (use this link in the delivery email)
    ?preview=1        shows the "jump to screen" menu so you can check every screen
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find Your Teen's First Real Project</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
  :root{
    --bg:#FAF8F6; --panel:#ded2eb; --text:#3c2415; --accent:#b3c9f1;
    --action:#037A8C; --on-action:#FFFFFF; --action-text:#037A8C;
    --font-heading:'Montserrat', Georgia, serif; --font-body:'Nunito', 'Segoe UI', Arial, sans-serif;
    --radius:22px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
  body{min-height:100vh}
  .wrap{max-width:640px;margin:0 auto;padding:28px 22px 56px}
  .brandbar{display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin-bottom:26px}
  .brandbar .time{letter-spacing:.04em;text-transform:none;font-weight:500;opacity:.8}
  h1,h2,h3{font-family:var(--font-heading);line-height:1.12;margin:0}
  h1{font-size:clamp(32px,7vw,46px);font-weight:600}
  h2{font-size:clamp(26px,5.6vw,34px);font-weight:600}
  h3{font-size:20px;font-weight:600}
  p{line-height:1.6;margin:0}
  .eyebrow{display:inline-block;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--action-text);margin-bottom:14px}
  .sub{font-size:17px;margin-top:16px}
  .card{background:var(--panel);border-radius:var(--radius);padding:22px 22px}
  .bullets{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px}
  .bullets li{display:flex;gap:12px;font-size:16px;line-height:1.5}
  .bullets li:before{content:"";flex:0 0 10px;height:10px;margin-top:8px;border-radius:50%;background:var(--action)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;background:var(--action);color:var(--on-action);font:600 17px var(--font-body);padding:17px 30px;cursor:pointer;text-decoration:none;width:100%;margin-top:22px}
  .btn:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--text)}
  .small{font-size:13px;line-height:1.5;opacity:.85}
  .about{display:flex;gap:14px;align-items:center;margin-top:26px}
  .about img{width:58px;height:58px;border-radius:50%;object-fit:cover}
  .about .dot{width:58px;height:58px;border-radius:50%;background:var(--accent);flex:0 0 58px}
  .progress{height:8px;border-radius:99px;background:var(--panel);overflow:hidden;margin-bottom:26px}
  .progress span{display:block;height:100%;background:var(--action);transition:width .3s}
  .qcount{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;margin-bottom:10px;opacity:.8}
  .opts{display:grid;gap:12px;margin-top:22px}
  .opt{text-align:left;background:var(--panel);color:var(--text);border:1.5px solid transparent;border-radius:18px;padding:17px 18px;font:500 16px/1.45 var(--font-body);cursor:pointer}
  .opt:hover{border-color:var(--action)}
  .back{background:none;border:0;color:var(--text);font:500 14px var(--font-body);margin-top:18px;cursor:pointer;opacity:.75;padding:6px 0}
  .result-name{margin:6px 0 10px}
  .insight{border-left:4px solid var(--action);padding:4px 0 4px 16px;margin-top:18px;font-size:16px}
  .locked{position:relative;margin-top:22px}
  .locked .blur{filter:blur(7px);user-select:none;pointer-events:none}
  .step{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--accent)}
  .step:first-of-type{border-top:0}
  .step .n{font-family:var(--font-heading);font-size:26px;line-height:1;color:var(--action-text);min-width:28px}
  .step h3{font-size:18px;margin-bottom:4px}
  .gate{position:relative;margin-top:18px;background:var(--bg);border:1.5px solid var(--text);border-radius:var(--radius);padding:20px 20px 22px}
  .gate h3{font-size:22px}
  .ready{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--panel);border-radius:99px;padding:6px 12px 6px 8px;margin-bottom:12px}
  .ready i{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--action);color:var(--on-action);font-style:normal;font-size:12px}
  .peek{position:relative;background:var(--panel);border-radius:16px;padding:4px 16px;margin-top:12px;overflow:hidden;max-height:92px}
  .peek .blur{filter:blur(5px);user-select:none;pointer-events:none}
  .peek .step{padding:10px 0}
  .peek .step h3{font-size:16px}
  .peek .step p{font-size:14px}
  .peek .lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .peek .lock span{background:var(--bg);border-radius:99px;padding:8px 14px;font-size:13px;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.08)}
  .t-head .result-name{font-size:clamp(30px,7vw,40px)}
  .t-head .sub{font-size:16px}
  .why{margin-top:26px}
  .why h3{font-size:19px}
  .build{min-height:70vh;display:flex;flex-direction:column;justify-content:center}
  .build h2{margin-bottom:6px}
  .build .bigbar{height:12px;border-radius:99px;background:var(--panel);overflow:hidden;margin:22px 0 8px}
  .build .bigbar span{display:block;height:100%;width:0;background:var(--action);transition:width 3s linear}
  .checks{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:12px}
  .checks li{display:flex;gap:12px;align-items:center;font-size:16px;opacity:.35;transition:opacity .3s}
  .checks li.on{opacity:1}
  .checks li i{flex:0 0 24px;height:24px;border-radius:50%;border:2px solid var(--action);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;color:var(--on-action)}
  .checks li.done i{background:var(--action)}
  .checks li.done i:after{content:"\2713"}
  .echo{margin-top:24px;background:var(--panel);border-radius:16px;padding:14px 16px;font-size:15px;line-height:1.5;opacity:0;transition:opacity .4s}
  .echo.on{opacity:1}
  .echo b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
  @media (max-width:520px){.wrap{padding-top:18px}.brandbar{margin-bottom:16px}}
  .field{display:block;margin-top:12px}
  .field span{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  .field input{width:100%;border:1.5px solid var(--text);background:#fff;color:#1f1f1f;border-radius:14px;padding:12px 14px;font:16px var(--font-body)}
  .consent{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:13px;line-height:1.5}
  .consent input{width:20px;height:20px;margin-top:1px;flex:0 0 20px;accent-color:var(--action)}
  .consent a{color:inherit}
  .err{color:var(--action-text);font-size:13px;font-weight:600;margin-top:10px;min-height:18px}
  .bridge{margin-top:30px}
  .bridge p{font-size:17px;line-height:1.6;font-weight:600}
  .offer{background:var(--action);color:var(--on-action);border-radius:var(--radius);padding:24px 22px;margin-top:26px}
  .offer .eyebrow{color:var(--on-action);opacity:.9}
  .offer .btn{background:var(--on-action);color:var(--action)}
  .bars{display:grid;gap:12px;margin-top:18px}
  .bar label{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:6px}
  .bar .track{height:10px;border-radius:99px;background:var(--bg);overflow:hidden}
  .bar .fill{height:100%;background:var(--action)}
  .score{font-family:var(--font-heading);font-size:54px;line-height:1;color:var(--action-text)}
  .section{margin-top:28px}
  .disclaimer{margin-top:30px;font-size:12px;opacity:.75;line-height:1.5}
  .sent{display:flex;gap:10px;align-items:center;background:var(--panel);border-radius:16px;padding:12px 16px;font-size:14px;margin-bottom:22px}
  .jump{position:fixed;right:12px;bottom:12px;background:#1f1f1f;color:#fff;border-radius:14px;padding:10px;font:12px/1.4 system-ui,sans-serif;z-index:9;max-width:220px}
  .jump b{display:block;margin-bottom:6px}
  .jump button{display:block;width:100%;text-align:left;background:#333;color:#fff;border:0;border-radius:8px;padding:6px 8px;margin-top:4px;cursor:pointer;font:12px system-ui,sans-serif}
  .numform{margin-top:22px}
  .numwrap{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--text);border-radius:16px;padding:6px 16px;font-size:22px;font-weight:600}
  .numwrap input::-webkit-outer-spin-button,.numwrap input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .numwrap input::placeholder{color:#9a929f;font-weight:400}
  .numwrap input{-moz-appearance:textfield;flex:1;min-width:0;border:0;outline:0;background:transparent;color:#1f1f1f;font:600 26px var(--font-body);padding:10px 0}
  .numwrap:focus-within{outline:3px solid var(--accent);outline-offset:2px}
  .bignum{background:var(--panel);border-radius:18px;padding:14px 18px;margin:4px 0 14px;display:flex;flex-direction:column;gap:2px}
  .bignum b{font-family:var(--font-heading);font-size:clamp(34px,9vw,46px);line-height:1.05;color:var(--action-text)}
  .bignum span{font-size:14px;font-weight:600}
  .small-name{font-size:clamp(24px,6vw,30px)!important;margin-top:0!important}
  .nums{display:grid;gap:0}
  .numrow{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:12px 0;border-top:1px solid var(--accent);font-size:15px}
  .numrow:first-child{border-top:0}
  .numrow b{font-family:var(--font-heading);font-size:22px;color:var(--action-text);white-space:nowrap}
  .peek .numrow{padding:8px 0}
  .reassure{text-align:center;margin-top:12px}
  /* ---------- desktop and tablet ---------- */
  @media (min-width:960px){
    .wrap{max-width:1160px;padding:36px 48px 72px}
    .wrap.v-question,.wrap.v-build{max-width:780px}
    .wrap.v-question{padding-top:56px}
    .brandbar{margin-bottom:44px}
    h1{font-size:clamp(44px,4.4vw,62px)}
    .sub{font-size:19px}
    .w-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);grid-template-areas:"intro side" "cta side";column-gap:64px;align-items:start;min-height:62vh}
    .w-intro{grid-area:intro;padding-top:28px}
    .w-side{grid-area:side;align-self:center}
    .w-side .card{margin-top:0;padding:34px 34px}
    .w-side .bullets li{font-size:17px}
    .w-cta{grid-area:cta}
    .w-cta .btn{width:auto;min-width:320px}
    .w-cta .reassure{text-align:left}
    .opts{grid-template-columns:1fr;gap:14px}
    .opt{padding:20px 22px;font-size:17px}
    .v-question h2{font-size:38px}
    .t-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,460px);grid-template-areas:"head gate" "why gate";grid-template-rows:auto 1fr;column-gap:64px;row-gap:8px;align-items:start}
    .t-head{grid-area:head;padding-top:20px}
    .t-grid .gate{grid-area:gate;margin-top:0;position:sticky;top:24px;padding:28px 28px 30px}
    .t-why{grid-area:why}
    .t-head .result-name{font-size:clamp(44px,4.4vw,60px)}
    .r-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:64px;align-items:center;padding:12px 0 8px}
    .r-head .result-name{font-size:clamp(44px,4.4vw,60px)}
    .r-ins .insight{margin-top:0;font-size:18px}
    .r-main .card{padding:34px 38px}
    .r-main .card>h3{font-size:26px;margin-bottom:22px}
    .r-main .card{column-count:2;column-gap:40px}
    .r-main .card>h3{column-span:all}
    .r-main .step{break-inside:avoid;padding:16px 0;border-top:1px solid var(--accent)}
    .r-main .nums{column-span:all;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .r-main .numrow{flex-direction:column;align-items:flex-start;background:var(--bg);border:0;border-radius:16px;padding:16px 18px}
    .bridge{max-width:820px;margin:44px auto 0;text-align:center}
    .bridge p{font-size:21px}
    .offer{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.8fr);column-gap:48px;align-items:center;padding:40px 48px;margin-top:24px}
    .offer .btn{margin-top:0}
    .r-foot{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.8fr);column-gap:48px;align-items:end;margin-top:12px}
    .r-follow .btn{margin-top:28px;text-align:center}
    .sent{max-width:520px}
  }
  .dsec{margin-top:18px}
  .dsec h3{margin-bottom:10px}
  .dsec p{font-size:16px}
  .dsec.soft{background:transparent;border:1.5px solid var(--accent)}
  .dsec.wide p{font-size:17px}
  .qw{margin-top:18px;border:2px solid var(--action);border-radius:var(--radius);padding:22px;background:var(--bg)}
  .qw h3{font-size:22px;margin-bottom:6px}
  .qw .eyebrow{margin-bottom:8px}
  .save{width:auto;margin:22px auto 0;display:flex;padding:12px 26px;font-size:15px}
  @media print{.jump,.offer,.bridge,.save,.back,.r-follow,.sent{display:none!important} .card,.qw{break-inside:avoid}}
  @media (min-width:960px){
    .duo{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:28px}
    .duo.one{grid-template-columns:1fr}
    .duo .dsec{margin-top:0;padding:30px 34px}
    .dsec.wide{margin-top:24px;padding:30px 38px}
    .qw{margin-top:24px;padding:30px 38px;display:grid;grid-template-columns:220px 1fr;column-gap:32px;align-items:start}
    .qw .eyebrow{grid-row:span 2;margin-top:6px}
    .r-main .card{margin-top:24px}
  }
  [hidden]{display:none!important}
.opts.icons{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.opt.has-icon{text-align:center;background:#fff;border:2px solid var(--panel);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 10px;font-weight:700}.opt.has-icon .oi svg{width:100%;max-width:120px;height:auto;max-height:80px;display:block}.opt.has-icon:hover,.opt.has-icon:focus-visible{border-color:var(--action)}
.gu{background:#fff;border:2px solid var(--panel);border-radius:18px;padding:20px;margin:18px 0}.gu ol{padding-left:22px}.gu .cohort{background:var(--panel);border-radius:14px;padding:16px;margin-top:14px}

.pt-hero{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;align-items:center;background:var(--panel);border-radius:24px;padding:18px;margin:8px 0 14px}
.pt-art svg{width:100%;height:auto}.pt-sum{font-size:18px;margin:6px 0 0}
.pt-lens{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.2fr);gap:10px;align-items:center;margin:0 0 18px}
.pt-lens span{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;margin-bottom:4px}
.pt-see{background:#fff;border:2px dashed #cdbfb3;border-radius:18px;padding:14px}.pt-see b{font-size:18px;color:#7a6455}
.pt-we{background:var(--action);color:#fff;border-radius:18px;padding:14px}.pt-we b{font-size:20px;font-family:var(--font-heading)}
.pt-arrow{font-size:28px;font-weight:900;color:var(--action)}
.pt-sec{margin:20px 0}.pt-sec h3{margin-bottom:10px}
.pt-chips{display:flex;flex-wrap:wrap;gap:8px}.pt-chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--panel);border-radius:999px;padding:4px 12px 4px 4px;font-weight:700;font-size:15px}
.pt-ic{display:inline-block;width:34px;height:30px}.pt-ic svg{width:100%;height:100%}
.pt-note{font-size:15px;margin:8px 0 0}
.pt-powers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pt-power{background:#fff;border:2px solid var(--panel);border-radius:18px;padding:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.pt-power .pt-ic{width:64px;height:54px}.pt-power b{font-family:var(--font-heading);font-size:16px}.pt-power span{font-size:13px;line-height:1.35}
.pt-tonight{background:var(--text);color:#fff;border-radius:24px;padding:20px;margin:20px 0}.pt-tonight .eyebrow{color:#b3c9f1}.pt-tonight h2{color:#fff;margin:0 0 6px}
.pt-path{list-style:none;padding:0;margin:0;border-left:4px dotted var(--panel);margin-left:16px}
.pt-path li{position:relative;padding:6px 0 10px 26px}.pt-path li>span{position:absolute;left:-19px;top:4px;width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid var(--action);display:grid;place-items:center;font-weight:900;font-family:var(--font-heading)}
.pt-path li.done>span{background:var(--action);color:#fff}.pt-path em{font-size:13px;color:var(--action-text);margin-left:6px;font-style:normal;font-weight:700}
.pt-path summary,.pt-more summary{cursor:pointer;list-style:none}.pt-path summary::after,.pt-more summary::after{content:" +";color:var(--action-text);font-weight:900}
.pt-path details[open] summary::after,.pt-more[open] summary::after{content:" \2212"}
.pt-path p,.pt-more p{margin:6px 0 0;font-size:15px}
.pt-more{background:#fff;border:1.5px solid var(--panel);border-radius:14px;padding:12px 14px;margin:8px 0;font-weight:700}.pt-more p{font-weight:400}
.pt-app{display:grid;grid-template-columns:90px minmax(0,1fr);gap:14px;align-items:center;border:3px solid var(--action);border-radius:24px;padding:18px;margin:20px 0}.pt-appart svg{width:100%;height:auto}.pt-app .btn{margin-top:10px}
.pt-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0}
.pt-two>div{border-radius:18px;padding:14px}.pt-do{background:#e6f4f2}.pt-dont{background:#f8ebe6}.pt-two ul{margin:0;padding-left:18px;font-size:15px}.pt-two li{margin:4px 0}
.pt-cards{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.pt-card{flex:0 0 72%;max-width:260px;scroll-snap-align:start;background:var(--panel);border-radius:18px;padding:16px;font-weight:700;font-size:17px;line-height:1.35}
.pt-card span{display:block;font-family:var(--font-heading);font-size:28px;color:var(--action-text)}

</style>
</head>

0.01, "icon": "make"}, {"text": "Depends on the day", "result": "c", "tags": ["mix"], "weight": 0.01, "icon": "crew"}]}, {"q": "What would make a new challenge feel doable for them?", "help": "This changes how each mission is written. Nothing here is saved.", "options": [{"text": "Short steps, one thing at a time", "result": "c", "tags": ["short"], "weight": 0.01, "icon": "time"}, {"text": "Clear examples, because they take things literally", "result": "b", "tags": ["concrete"], "weight": 0.01, "icon": "noidea"}, {"text": "Talking to people they already know, not strangers", "result": "c", "tags": ["familiar"], "weight": 0.01, "icon": "duo"}, {"text": "Nothing special, they're ready to go", "result": "a", "tags": ["ready"], "weight": 0.01, "icon": "rocket"}], "private": true}, {"q": "How do they learn right now?", "help": "British, US, Canadian, Australian, Cambridge and IB all count as following a curriculum.", "options": [{"text": "Following a national or international curriculum", "result": "a", "tags": ["curriculum"], "weight": 0.01, "icon": "book"}, {"text": "Montessori, Reggio Emilia or Charlotte Mason", "result": "c", "tags": ["childled"], "weight": 0.01, "icon": "planet"}, {"text": "Unschooling or self-directed", "result": "b", "tags": ["selfdirected"], "weight": 0.01, "icon": "explore"}, {"text": "At school, with projects at home", "result": "a", "tags": ["school"], "weight": 0.01, "icon": "school"}, {"text": "A mix of everything", "result": "c", "tags": ["mix"], "weight": 0.01, "icon": "crew"}]}, {"q": "Do you need to show their learning to anyone?", "options": [{"text": "Yes, for a local authority, annual review or state check-in", "result": "a", "tags": ["report"], "weight": 0.01, "icon": "waste"}, {"text": "We keep a portfolio for ourselves or applications", "result": "a", "tags": ["portfolio"], "weight": 0.01, "icon": "draw"}, {"text": "No, it's just for us", "result": "b", "tags": ["own"], "weight": 0.01, "icon": "solo"}, {"text": "Not sure yet", "result": "c", "tags": ["mix"], "weight": 0.01, "icon": "cloud"}]}, {"q": "How much time could they give this each week?", "options": [{"text": "About 15 minutes, honestly", "result": "c", "tags": ["tiny"], "weight": 0.01, "icon": "time"}, {"text": "An hour or so", "result": "b", "tags": ["hour"], "weight": 0.01, "icon": "energy"}, {"text": "More, if it hooks them", "result": "a", "tags": ["deep"], "weight": 0.01, "icon": "rocket"}]}, {"q": "When you ask what they'd love to do, what do you usually hear?", "help": "The answer that comes up most at your dinner table.", "options": [{"text": "An idea they keep coming back to", "result": "a", "tags": ["ready"], "weight": 3, "icon": "idea"}, {"text": "Something about the game or hobby they're into", "result": "b", "tags": ["game"], "weight": 3, "icon": "game"}, {"text": "\"I don't know\"", "result": "c", "tags": ["tiny"], "weight": 3, "icon": "cloud"}]}], "results": {"a": {"name": "The Spark", "summary": "They've already got an idea. Now it needs real people, not a perfect plan.", "insight": "The biggest risk for a Spark isn't a bad idea. It's waiting for the perfect version, or the right time. Ideas get better by meeting real people, not by being polished in their head. The right time is now, even if it's a micro-action.", "signs": ["They bring up the same idea more than once", "They've started something before, then quietly dropped it", "They light up explaining it, then shrug when you ask what's next"], "strengths": ["They already care about something enough to keep coming back to it", "They can picture something that doesn't exist yet"], "why": "Sparks often keep their idea safe inside their head, because sharing it makes it real, and real can feel wobbly. Meanwhile, adults ask \"but how would you pay for it?\" before \"who is it for?\" So the idea stalls before anyone who'd benefit has even heard about it.", "quickWin": {"title": "Mission 1: Why does this matter?", "text": "Ask them to say their idea in one sentence, then finish this line: \"This matters to me because...\" A sticky note or a 30-second voice note is perfect. Messy counts.", "time": "15 minutes"}, "avoid": ["Waiting for the perfect version before showing anyone", "Asking \"how will you pay for it?\" before \"who is it for?\"", "Planning in secret instead of testing it with real people"], "outcome": "A few weeks from now, their idea has left their head. They've talked to real people, made a rough first version and found one first follower. And they can tell you all about it at dinner.", "bridge": "That's their idea out of their head and into the world. In Launch Your First Real Project, they build it, launch it to at least 10 real people and pitch it, with peers in other countries cheering them on."}, "b": {"name": "The Player", "summary": "They'd play all day if you let them. That's not the problem. It's the clue.", "insight": "The game isn't the project. It shows you which problems they love solving: building, strategy, rescuing, leading a team, exploring. Ask which tasks and storylines they love, and why, and you'll hear what kind of real-world problem would hook them.", "signs": ["You hear a lot about one game, show or hobby", "They'll spend hours on one level but \"can't be bothered\" with schoolwork", "They explain game strategy in more detail than their day"], "strengths": ["Deep focus when something matters to them", "They already solve hard problems for fun"], "why": "Games are brilliantly designed problems: a clear goal, fast feedback and a reason to keep going. Most schoolwork doesn't feel like that, so the gap looks like laziness. It's actually a sign they love the right kind of challenge.", "quickWin": {"title": "Mission 1: Your game, decoded", "text": "Ask three questions, then just listen. Which game? Why do you like it? Which tasks or storylines do you love solving, and why? Jot down the verbs they use: build, win, fix, explore, lead.", "time": "15 minutes"}, "avoid": ["Treating their game as the enemy instead of the clue", "Cutting screen time before asking what they love about it", "Choosing a \"worthy\" project for them"], "outcome": "In a few weeks, \"play games all day\" has become \"fix something real\": a guide, an event, a tool or a club built around the problems they love solving.", "bridge": "You've just found the problems they love solving. In Launch Your First Real Project, they turn one into a real project, launch it to at least 10 real people and pitch it, with peers in other countries cheering them on."}, "c": {"name": "The Dreamer", "summary": "\"I don't know\" isn't a no. Nobody's asked them with no limits yet.", "insight": "Teens say \"I don't know\" when every answer feels judged by budgets, rules and grown-up expectations. Take the limits away first. Even \"play video games all day\" is a great start, because they'll get bored, and boredom is where the real ideas show up.", "signs": ["\"I don't know\" is their go-to answer about the future", "They have interests but wouldn't call them passions", "They worry about choosing the \"wrong\" thing"], "strengths": ["They think before they commit", "They notice more than they say"], "why": "Most \"what do you want to do?\" questions come with hidden rules: it has to be sensible, affordable and approved. Dreamers are often quietly curious and very aware of those rules, so they play it safe and say nothing at all.", "quickWin": {"title": "Mission 1: No limits", "text": "Ask: \"If you had complete control for a week, no budget and no rules from us, what would you do?\" Any answer counts. Then ask: \"What would you get bored of first?\"", "time": "15 minutes"}, "avoid": ["Filling the silence with your own suggestions", "Judging the first answer, however silly it sounds", "Waiting for a passion to arrive before starting anything"], "outcome": "In a few weeks, \"I don't know\" has become \"I could try this.\" They've picked a small real problem, taken a first micro-action and found out that starting messy works.", "bridge": "You've given them permission to dream with no limits. In Launch Your First Real Project, they turn that dream into one real project, launch it to at least 10 real people and pitch it, with peers in other countries cheering them on."}}, "generate": {"title": "Their quest, after Mission 1", "count": 7, "bank": [{"title": "Who would benefit?", "text": "Name three people who'd use or love their idea. Then ask one of them: \"What's the most annoying part of this for you?\" Listen more than pitch. Bonus: ask someone who lives in another country.", "tags": ["ready", "hour", "deep"], "result": "a", "group": "m2", "n": "2"}, {"title": "Who would benefit?", "text": "Start close to home. Ask a sibling, cousin, friend or neighbor what bugs them about the thing they care about. Two conversations are plenty.", "tags": ["familiar", "short"], "group": "m2", "n": "2"}, {"title": "Who else plays?", "text": "Who else loves the same game or hobby? Ask two of them which part they'd change if they could. Online friends count, with a grown-up's OK.", "tags": ["game", "voice"], "result": "b", "group": "m2", "n": "2"}, {"title": "Who would love this too?", "text": "Look back at their no-limits answer. Who else would love that? Ask two people what they'd add to it.", "tags": ["tiny", "planet", "people"], "result": "c", "group": "m2", "n": "2"}, {"title": "How might we...?", "text": "Finish this sentence together: \"How might we help ___ to ___?\" For example: \"How might we help new players learn the game without quitting?\" Write three versions and circle the most real one.", "tags": ["write", "hour", "game"], "group": "m3", "n": "3"}, {"title": "How might we...?", "text": "Fill in the blanks one at a time. Who? (one group of people) What's hard for them? (one thing) Then join them up: \"How might we help (who) with (what)?\" Example: \"How might we help younger kids feel brave in the pool?\"", "tags": ["concrete", "short"], "group": "m3", "n": "3"}, {"title": "Ask why, five times", "text": "Ask \"Why is that a problem?\" five times in a row. The fifth answer is usually the real problem. Then write it as \"How might we...?\"", "tags": ["deep", "ready"], "result": "a", "group": "m3", "n": "3"}, {"title": "The 60-second voice note", "text": "Record a voice note: \"The problem I noticed is... It matters because... How might we...?\" One take, no editing.", "tags": ["voice", "tiny", "mix"], "group": "m3", "n": "3"}, {"title": "What's the smallest version?", "text": "What's the smallest version they could make this week? A poster, a sketch, a one-page guide, a 30-second video or a test for three people. Ugly is allowed.", "tags": ["make", "build", "create"], "result": "a", "group": "m4", "n": "4"}, {"title": "Build level 1", "text": "Make the level 1 version: one page, one video or one tiny test that solves only the very first part of the problem. Level 2 can wait.", "tags": ["game", "hour"], "result": "b", "group": "m4", "n": "4"}, {"title": "Pick one, 20 minutes", "text": "Pick ONE: draw it, describe it in five sentences, or build it from what's in the house. Set a 20-minute timer, then stop.", "tags": ["short", "tiny", "concrete"], "group": "m4", "n": "4"}, {"title": "Plan a tiny trial", "text": "Plan a trial small enough to do this week: one table at a market, one litter pick, one 15-minute workshop for a younger sibling.", "tags": ["planet", "people", "deep"], "result": "c", "group": "m4", "n": "4"}, {"title": "Who could be your first follower?", "text": "Name one person who'd say \"yes, I want that\" and show them the rough version. Ask: \"What would make you use it again?\"", "tags": ["ready", "people", "write"], "group": "m5", "n": "5"}, {"title": "Close-to-home first follower", "text": "First followers can be family friends, cousins or classmates. Share the rough version with one of them, in person or by message.", "tags": ["familiar", "short", "tiny"], "group": "m5", "n": "5"}, {"title": "Find your party", "text": "Share it where their people already are: a club, a team or a gaming friend. Anything online gets a grown-up's OK first.", "tags": ["game", "voice"], "result": "b", "group": "m5", "n": "5"}, {"title": "One action this week", "text": "What's one action they could take this week? Write it on a sticky note with a day next to it. Start while it's still a little messy.", "tags": ["ready", "hour", "write"], "group": "m6", "n": "6"}, {"title": "One micro-action", "text": "One action, under 10 minutes: send one message, sketch one screen or ask one person one question. The right time is now, even if it's tiny.", "tags": ["tiny", "short"], "group": "m6", "n": "6"}, {"title": "Book the next session", "text": "Block one hour this weekend for version 2 and invite one person to come and see it. Saying it out loud makes it real.", "tags": ["deep", "people", "make"], "group": "m6", "n": "6"}, {"title": "Show your learning", "text": "Note which subjects each mission touched: English for interviews, math for any budget, design or computing for the build. Add a dated photo or note after each one.", "tags": ["curriculum", "report"], "group": "log", "n": "★"}, {"title": "Show your learning", "text": "Capture it the way you already do: a photo, their own words and what they chose to do next. Child-led learning, beautifully documented.", "tags": ["childled", "portfolio"], "group": "log", "n": "★"}, {"title": "Show your learning", "text": "A quick \"what I did, what I learned, what's next\" voice note after each mission. Real-world learning counts.", "tags": ["selfdirected", "own", "voice"], "group": "log", "n": "★"}, {"title": "Show your learning", "text": "Keep one dated note per mission. It makes a strong example for a personal statement, a school project or a sixth form or college application.", "tags": ["school", "portfolio"], "group": "log", "n": "★"}, {"title": "Show your learning", "text": "If you need to show progress (an annual review, a local authority report or a state check-in), save one dated entry per mission. Check what your local rules ask for.", "tags": ["report", "mix"], "group": "log", "n": "★"}, {"title": "The skills this quest builds", "text": "Money: sizing and budgeting the smallest version. AI and digital: researching and building it. People: interviewing real people, including someone from another culture. The skills school leaves out, learned by doing.", "tags": [], "always": true, "group": "skills", "n": "✓"}]}, "teaser": {"eyebrow": "Their starting point", "lockedTitle": "Your teen's 6-step project quest", "stepsTitle": "Their quest", "boxTitle": "Their 6-step quest is ready", "boxText": "Five more missions picked from your answers, plus how to show the learning. Pop your details in and I'll show you now and email you a copy.", "consent": "I'm 18 or over. Yes, send me the quest and Jess's emails about real projects for teens. You can unsubscribe at any time.", "privacyText": "Privacy policy", "consentError": "Please tick the box so I can send your quest.", "button": "Show me their quest", "readyText": "Built from your {count} answers", "lockText": "Unlock their quest", "insightTitle": "What's really going on"}, "building": {"eyebrow": "Just a moment", "title": "Building their quest", "steps": ["Reading your {count} answers", "Finding the problems they love solving", "Sizing missions to the time they've got", "Writing their first mission"], "quoteLabel": "You told me you usually hear"}, "resultsPage": {"sentNote": "A copy of their quest is on its way to your inbox too.", "storyTitle": "Why I made this", "story": "I was the kid a teacher once took credit from, after I spent weeks writing and illustrating a book. I've spent 20+ years as an educator, and now as a worldschooling parent, refusing to let capable young people be dimmed. The best projects I've seen didn't start with a perfect idea. They started with someone trusting a young person to lead.", "followText": "Follow along on Instagram", "followUrl": "https://instagram.com/mischieffinder", "saveText": "Save their quest", "titles": {"signs": "You'll recognize this if...", "strengths": "What they're already doing well", "why": "Why this keeps happening", "quickWin": "Start here", "avoid": "What to avoid", "outcome": "What changes when they get going"}}, "offer": {"eyebrow": "Free live session · Tuesday, December 29", "title": "Build Their Quest App, Live", "text": "Bring your teen's quest app and their feedback. I'll remix quests like yours live, with new missions, their curriculum topics and the right level of challenge, and show you how our January cohort helps them launch the real thing.", "button": "Save my free seat", "url": "", "note": "Free · [time UK / US] · recording sent to everyone who signs up"}, "optin": {"webhookUrl": "", "tags": ["freebie-project-quest"], "resultTags": {"a": "project-quest-spark", "b": "project-quest-player", "c": "project-quest-dreamer"}}, "questApp": {"url": "quest/", "eyebrow": "Yours to keep", "title": "Their Rebel Quest, a game made for them", "text": "Your teen picks pictures, moves a piece on a chessboard toward what they love and names what gets in their way. Then they play six bite-sized missions written from their answers, earning badges as they go. Everything stays on your device.", "button": "Open their Rebel Quest"}, "icons": {"rocket": "<svg viewBox=\"0 0 120 100\" aria-hidden=\"true\" focusable=\"false\"><ellipse cx=\"60\" cy=\"92\" rx=\"30\" ry=\"5\" fill=\"#0001\"/><path d=\"M60 8c18 12 24 34 18 58H42C36 42 42 20 60 8z\" fill=\"#fff\" stroke=\"#3c2415\" stroke-width=\"4\"/><circle cx=\"60\" cy=\"38\" r=\"9\" fill=\"#05ABC4\" stroke=\"#3c2415\" stroke-width=\"3\"/><path d=\"M42 50L28 70h16M78 50l14 20H76\" fill=\"#ee8b6b\" stroke=\"#3c2415\" stroke-width=\"3\" stroke-linejoin=\"round\"/><path d=\"M50 70c0 10 4 16 10 22 6-6 10-12 10-22z\" fill=\"#f4c95d\"/><\/svg>", "say": "<svg viewBox=\"0 0 120 100\" aria-hidden=\"true\" focusable=\"false\"><rect x=\"44\" y=\"10\" width=\"32\" height=\"52\" rx= (function(){
  var C = JSON.parse(document.getElementById('config').textContent);
  var app = document.getElementById('app');
  var params = new URLSearchParams(location.search);
  var T = C.app.type;
  var CALC = T === 'calculator', GEN = T === 'generator';
  var Q = CALC ? (C.inputs || []) : (C.questions || []);
  var state = {i:0, answers:[], vals:{}, out:{}, picks:[], result:null, score:null, areas:null, name:'', timer:null};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function store(k,v){try{sessionStorage.setItem(k,v);}catch(e){}}
  function read(k){try{return sessionStorage.getItem(k);}catch(e){return null;}}
  function top(){window.scrollTo(0,0);}
  function view(v){app.className='wrap v-'+v;}
  function bar(){return '<div class="brandbar"><span>'+esc(C.brand.logoText||C.app.business)+'</span><span class="time">'+esc(C.welcome.time||'')+'</span></div>';}
  function disclaimer(){return C.app.disclaimer?'<p class="disclaimer">'+esc(C.app.disclaimer)+'</p>':'';}

  /* ---------- calculator maths ---------- */
  var FUNCS = {ceil:1, floor:1, round:1, min:1, max:1, abs:1};
  function evalF(expr, v){
    expr = String(expr||'0');
    if(!/^[\w\s+\-*\/().,]*$/.test(expr)) return 0;
    var js = expr.replace(/[A-Za-z_]\w*/g, function(id){
      if(FUNCS[id]) return 'Math.'+id;
      if(id in v) return '('+(Number(v[id])||0)+')';
      return '0';
    });
    try { var x = Function('"use strict";return ('+js+');')(); return isFinite(x) ? x : 0; } catch(e){ return 0; }
  }
  function money(n, cur){ return (cur||'') + Math.round(n).toLocaleString(undefined); }
  function fmt(o, val){
    if(val==null || isNaN(val)) return '';
    var f = o.format || 'number', d = o.decimals || 0, s;
    if(f === 'money') s = money(val, o.prefix != null ? o.prefix : (C.app.currency || ''));
    else if(f === 'percent') s = (Math.round(val*Math.pow(10,d))/Math.pow(10,d)) + '%';
    else s = (Math.round(val*Math.pow(10,d))/Math.pow(10,d)).toLocaleString(undefined) ;
    if(f !== 'money' && o.prefix) s = o.prefix + s;
    if(f === 'hours' && !o.suffix) s += (Math.round(val) === 1 ? ' hour' : ' hours');
    if(o.suffix) s += o.suffix;
    return s;
  }
  function inputText(inp){
    var v = state.vals[inp.key];
    if(inp.options){ var o = inp.options.filter(function(x){return x.value == v;})[0]; return o ? o.text : ''; }
    return fmt({format: inp.format || 'number', prefix: inp.prefix, suffix: inp.suffix}, v);
  }
  function compute(){
    var v = {}; Object.keys(state.vals).forEach(function(k){v[k]=Number(state.vals[k])||0;});
    (C.outputs||[]).forEach(function(o){ v[o.key] = evalF(o.formula, v); state.out[o.key] = v[o.key]; });
    var rb = C.resultBy || {}, val = state.out[rb.output], keys = Object.keys(C.results);
    var band = (rb.bands||[]).filter(function(b){ return b.max == null || val <= b.max; })[0];
    state.result = band ? band.key : keys[0];
  }

  /* ---------- generator picks ---------- */
  function pick(){
    var G = C.generate || {}, tags = {};
    Q.forEach(function(q,qi){ var o = q.options[state.answers[qi]]; (o && o.tags || []).forEach(function(t){ tags[t] = (tags[t]||0) + 1; }); });
    var scored = (G.bank||[]).map(function(it, ix){
      var s = 0; (it.tags||[]).forEach(function(t){ s += (tags[t]||0) * 2; });
      if(it.result && it.result === state.result) s += 3;
      if(it.always) s += 100;
      return {it:it, s:s, ix:ix};
    }).sort(function(a,b){ return b.s - a.s || a.ix - b.ix; });
    var out = [], groups = {};
    scored.forEach(function(x){ if(out.length >= (G.count||5)) return; var g = x.it.group; if(g && groups[g]) return; if(g) groups[g]=1; out.push(x.it); });
    if(out.length < (G.count||5)) scored.forEach(function(x){ if(out.length < (G.count||5) && out.indexOf(x.it) < 0) out.push(x.it); });
    var BK=(G.bank||[]); out.sort(function(a,b){return BK.indexOf(a)-BK.indexOf(b);});
    state.picks = out;
  }

  /* ---------- text with {placeholders} ---------- */
  function fill(t, r){
    r = r || C.results[state.result] || {name:''};
    return String(t||'').replace(/\{(\w+)\}/g, function(m, k){
      if(k === 'count') return Q.length;
      if(k === 'result') return r.name;
      if(k === 'plan') return String(C.teaser.lockedTitle||'plan').replace(/^your\s+/i,'');
      if(k === 'name') return state.name || '';
      var o = (C.outputs||[]).filter(function(x){return x.key===k;})[0];
      if(o && state.out[k] != null) return fmt(o, state.out[k]);
      var inp = (C.inputs||[]).filter(function(x){return x.key===k;})[0];
      if(inp && state.vals[k] != null) return inputText(inp);
      return m;
    });
  }

  function welcome(){
    var w=C.welcome;
    var about = w.aboutName ? '<div class="about">'+(w.photo?'<img src="'+esc(w.photo)+'" alt="">':'<div class="dot" aria-hidden="true"></div>')+'<p class="small"><b>'+esc(w.aboutName)+'</b><br>'+esc(w.aboutLine||'')+'</p></div>' : '';
    view('welcome');
    app.innerHTML = bar()+'<div class="w-grid">'+
      '<div class="w-intro"><span class="eyebrow">'+esc(w.eyebrow)+'</span><h1>'+esc(w.headline)+'</h1><p class="sub">'+esc(w.subheader)+'</p></div>'+
      '<div class="w-side"><div class="card section"><h3>'+esc(w.bulletsTitle)+'</h3><ul class="bullets">'+w.bullets.map(function(b){return '<li>'+esc(b)+'</li>';}).join('')+'</ul></div></div>'+
      '<div class="w-cta"><button class="btn" id="start">'+esc(w.button)+'</button>'+
      (w.reassure?'<p class="small reassure">'+esc(w.reassure)+'</p>':'')+about+'</div></div>'+disclaimer();
    document.getElementById('start').onclick=function(){state.i=0;state.answers=[];state.vals={};question();};
    top();
  }

  function next(){ if(state.i < Q.length-1){ state.i++; question(); } else { finish(); building(); } }
  function finish(){ if(CALC) compute(); else score(); if(GEN) pick(); store('fa_result', state.result); }

  function question(){
    view('question');
    var q=Q[state.i], n=Q.length, body;
    if(CALC && !q.options){
      var v = state.vals[q.key] != null ? state.vals[q.key] : '';
      var ph = q.placeholder || (q['default'] != null ? 'e.g. ' + q['default'] : '');
      body = '<form class="numform" id="nf" novalidate><label class="numwrap">'+(q.prefix?'<span>'+esc(q.prefix)+'</span>':'')+
        '<input id="num" type="number" inputmode="decimal" value="'+esc(v)+'" placeholder="'+esc(ph)+'"'+(q.min!=null?' min="'+q.min+'"':'')+(q.max!=null?' max="'+q.max+'"':'')+(q.step!=null?' step="'+q.step+'"':' step="any"')+' aria-label="'+esc(q.label)+'">'+
        (q.suffix?'<span>'+esc(q.suffix)+'</span>':'')+'</label><div class="err" id="nerr" role="alert"></div><button class="btn" type="submit">'+esc(q.button||'Next')+'</button></form>';
    } else {
      var IC=C.icons||{}, hasI=q.options.some(function(o){return o.icon&&IC[o.icon];}); body = '<div class="opts'+(hasI?' icons':'')+'">'+q.options.map(function(o,k){return '<button class="opt'+(hasI?' has-icon':'')+'" data-k="'+k+'">'+(hasI&&IC[o.icon]?'<span class="oi">'+IC[o.icon]+'</span>':'')+'<span>'+esc(o.text)+'</span></button>';}).join('')+'</div>';
    }
    app.innerHTML = bar()+
      '<div class="progress" aria-hidden="true"><span style="width:'+Math.round(state.i/n*100)+'%"></span></div>'+
      '<p class="qcount">'+esc(C.app.stepWord || (CALC ? 'Step' : 'Question'))+' '+(state.i+1)+' of '+n+'</p><h2>'+esc(CALC ? q.label : q.q)+'</h2>'+(q.help?'<p class="sub small">'+esc(q.help)+'</p>':'')+
      body+(state.i>0?'<button class="back" id="back">&larr; Back</button>':'');
    Array.prototype.forEach.call(app.querySelectorAll('.opt'),function(b){b.onclick=function(){
      var k = +b.getAttribute('data-k');
      if(CALC) state.vals[q.key] = q.options[k].value; else state.answers[state.i] = k;
      next();
    };});
    var nf=document.getElementById('nf');
    if(nf){ var inp=document.getElementById('num'); setTimeout(function(){try{inp.focus();}catch(e){}},50);
      nf.onsubmit=function(e){ e.preventDefault(); var x=parseFloat(inp.value);
        if(isNaN(x)){ document.getElementById('nerr').textContent=q.error||'Pop a number in to keep going (a rough guess is fine).'; return; }
        if(q.min!=null && x<q.min) x=q.min; if(q.max!=null && x>q.max) x=q.max;
        state.vals[q.key]=x; next(); }; }
    var bk=document.getElementById('back'); if(bk) bk.onclick=function(){state.i--;question();};
    top();
  }

  function score(){
    var keys=Object.keys(C.results);
    if(T==='assessment'){
      var total=0,max=0,areas={};
      (C.areas||[]).forEach(function(a){areas[a.key]={name:a.name,got:0,max:0};});
      Q.forEach(function(q,qi){
        var pts=q.options.map(function(o){return o.score||0;}), best=Math.max.apply(null,pts);
        var got=pts[state.answers[qi]]||0; total+=got; max+=best;
        if(q.area&&areas[q.area]){areas[q.area].got+=got;areas[q.area].max+=best;}
      });
      var pct=max?Math.round(total/max*100):0; state.score=pct; state.areas=areas;
      var band=(C.bands||[]).filter(function(b){return pct>=b.min&&pct<=b.max;})[0];
      state.result=band?band.key:keys[0];
      store('fa_score',state.score);
    } else {
      var count={}; keys.forEach(function(k){count[k]=0;});
      Q.forEach(function(q,qi){var o=q.options[state.answers[qi]]; if(o&&o.result in count) count[o.result]+=(o.weight||1);});
      var best=keys[0]; keys.forEach(function(k){if(count[k]>count[best]) best=k;});
      var lastKey=(Q[Q.length-1].options[state.answers[Q.length-1]]||{}).result;
      var tied=keys.filter(function(k){return count[k]===count[best];});
      if(tied.length>1&&tied.indexOf(lastKey)>-1) best=lastKey;
      state.result=best;
    }
  }

  /* ---------- pieces ---------- */
  function headline(){
    if(!CALC) return '';
    var o=(C.outputs||[]).filter(function(x){return x.headline;})[0] || (C.outputs||[])[0];
    if(!o) return '';
    return '<div class="bignum"><b>'+esc(fmt(o,state.out[o.key]))+'</b><span>'+esc(fill(o.bigLabel||o.label))+'</span></div>';
  }
  function resultHead(r, cls){
    var s = state.score!=null ? '<div class="score">'+state.score+'<span style="font-size:24px">/100</span></div>' : '';
    return '<div class="'+(cls||'')+'"><span class="eyebrow">'+esc(C.teaser.eyebrow)+'</span>'+s+headline()+'<h1 class="result-name'+(CALC?' small-name':'')+'">'+esc(fill(r.name,r))+'</h1><p class="sub" style="margin-top:0">'+esc(fill(r.summary,r))+'</p></div>';
  }
  function areaBars(){
    if(!state.areas) return '';
    return '<div class="card section"><h3>'+esc(C.teaser.areasTitle||'Your scores')+'</h3><div class="bars">'+Object.keys(state.areas).map(function(k){var a=state.areas[k],p=a.max?Math.round(a.got/a.max*100):0;return '<div class="bar"><label><span>'+esc(a.name)+'</span><span>'+p+'%</span></label><div class="track"><div class="fill" style="width:'+p+'%"></div></div></div>';}).join('')+'</div></div>';
  }
  function stepList(list){
    return list.map(function(s,k){return '<div class="step"><div class="n">'+esc(s.n!=null?s.n:k+1)+'</div><div><h3>'+esc(fill(s.title))+'</h3><p>'+esc(fill(s.text))+'</p></div></div>';}).join('');
  }
  function numbers(rows){
    return '<div class="nums">'+rows.map(function(o){return '<div class="numrow"><span>'+esc(fill(o.label))+'</span><b>'+esc(fmt(o,state.out[o.key]))+'</b></div>';}).join('')+'</div>';
  }
  function mainList(r){
    if(GEN) return stepList(state.picks);
    return stepList(r.steps||[]);
  }

  function building(){
    var r=C.results[state.result], b=C.building||{};
    var list=(b.steps&&b.steps.length?b.steps:['Reading your {count} answers','Spotting your pattern','Choosing the steps that fit you','Building your {plan}']);
    var qi=b.quoteQuestion!=null?b.quoteQuestion:Q.length-1, said='';
    if(CALC){ var inp=Q[qi]; if(inp) said=(inp.short||inp.label)+': '+inputText(inp); }
    else { var o=Q[qi]&&Q[qi].options[state.answers[qi]]; if(o) said=o.text; }
    var fast=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    view('build');
    app.innerHTML=bar()+'<div class="build" role="status"><span class="eyebrow">'+esc(b.eyebrow||'Just a moment')+'</span><h2>'+esc(fill(b.title||'Building your {plan}',r))+'</h2>'+
      '<div class="bigbar" aria-hidden="true"><span id="bb"></span></div>'+
      '<ul class="checks">'+list.map(function(x){return '<li><i aria-hidden="true"></i><span>'+esc(fill(x,r))+'</span></li>';}).join('')+'</ul>'+
      (said?'<div class="echo" id="echo"><b>'+esc(b.quoteLabel||'You told me')+'</b>'+(CALC?esc(said):'&ldquo;'+esc(said)+'&rdquo;')+'</div>':'')+'</div>';
    top();
    var items=app.querySelectorAll('.checks li'), gap=fast?150:Math.max(500,Math.round(3000/items.length)), k=0;
    var bb=document.getElementById('bb'); if(fast) bb.style.transition='none';
    requestAnimationFrame(function(){bb.style.width='100%';});
    var ec=document.getElementById('echo'); setTimeout(function(){if(ec) ec.classList.add('on');},fast?0:gap);
    (function tick(){
      if(k>0) items[k-1].classList.add('done');
      if(k<items.length){items[k].classList.add('on');k++;state.timer=setTimeout(tick,gap);}
      else state.timer=setTimeout(teaser,fast?200:700);
    })();
  }

  function teaser(){
    clearTimeout(state.timer);
    var r=C.results[state.result], t=C.teaser, peekHtml;
    if(CALC){ var rest=(C.outputs||[]).filter(function(o){return !o.headline;}); peekHtml = rest.length ? numbers(rest.slice(0,3)) : stepList((r.steps||[]).slice(0,2)); }
    else peekHtml = GEN ? stepList(state.picks.slice(0,2)) : stepList((r.steps||[]).slice(0,2));
    view('teaser');
    app.innerHTML = bar()+'<div class="t-grid">'+resultHead(r,'t-head')+
      '<form class="gate" id="gate" novalidate><span class="ready"><i aria-hidden="true">&#10003;</i>'+esc(fill(t.readyText||'Built from your {count} answers',r))+'</span>'+
      '<h3>'+esc(fill(t.boxTitle,r))+'</h3><p class="small" style="margin-top:6px">'+esc(fill(t.boxText,r))+'</p>'+
      '<div class="peek" aria-hidden="true"><div class="blur">'+peekHtml+'</div><div class="lock"><span>&#128274; '+esc(fill(t.lockText||'Unlock your {plan}',r))+'</span></div></div>'+
      '<label class="field"><span>First name</span><input id="fn" name="first_name" autocomplete="given-name" required></label>'+
      '<label class="field"><span>Email address</span><input id="em" name="email" type="email" autocomplete="email" required></label>'+
      '<label class="consent"><input type="checkbox" id="ok"><span>'+esc(t.consent)+' <a href="'+esc(C.app.privacyUrl||'#')+'" target="_blank" rel="noopener">'+esc(t.privacyText||'Privacy policy')+'</a></span></label>'+
      '<div class="err" id="err" role="alert"></div><button class="btn" type="button" id="gatebtn" style="margin-top:8px">'+esc(t.button)+'</button></form>'+
      '<div class="t-why">'+'<div class="why"><h3>'+esc(t.insightTitle||"What's really going on")+'</h3><p class="insight" style="margin-top:10px">'+esc(fill(r.insight,r))+'</p></div>'+areaBars()+'</div></div>'+disclaimer();
    setTimeout(function(){var gb=document.getElementById('gatebtn'); if(gb) gb.onclick=function(e){document.getElementById('gate').onsubmit(e);};},0);
    document.getElementById('gate').onsubmit=function(e){
      e.preventDefault();
      var fn=document.getElementById('fn').value.trim(), em=document.getElementById('em').value.trim(), ok=document.getElementById('ok').checked, err=document.getElementById('err');
      if(!fn){err.textContent='Please add your first name.';return;}
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){err.textContent='Please check your email address.';return;}
      if(!ok){err.textContent=t.consentError||'Please tick the box so I can send you your results.';return;}
      state.name=fn; store('fa_name',fn); send(fn,em); results(true);
    };
    top();
  }

  function link(){
    var u = location.origin + location.pathname + '?r=' + state.result;
    if(CALC) u += '&v=' + encodeURIComponent(Object.keys(state.vals).map(function(k){return k+':'+state.vals[k];}).join(','));
    else if(GEN) u += '&a=' + state.answers.map(function(x,qi){return Q[qi]&&Q[qi].private?9:x;}).join('');
    return u;
  }
  function send(fn,em){
    var o=C.optin||{}, r=C.results[state.result];
    var payload={first_name:fn,email:em,consent:true,consent_text:C.teaser.consent,freebie:C.app.name,result_key:state.result,result_name:fill(r.name,r),score:state.score,
      tags:(o.tags||[]).concat([(o.resultTags&&o.resultTags[state.result])||((o.resultTagPrefix||'result-')+state.result)]),results_link:link()};
    if(CALC){ payload.inputs={}; Q.forEach(function(q){payload.inputs[q.label]=inputText(q);}); payload.numbers={}; (C.outputs||[]).forEach(function(x){payload.numbers[x.label]=fmt(x,state.out[x.key]);}); }
    else payload.answers=Q.map(function(q,qi){return q.private?null:{question:q.q,answer:(q.options[state.answers[qi]]||{}).text};}).filter(Boolean);
    if(GEN) payload.plan=state.picks.map(function(x){return x.title;});
    if(!o.webhookUrl){ if(window.console) console.log('Opt-in (no webhook set yet):',payload); return; }
    try{fetch(o.webhookUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).catch(function(){
      fetch(o.webhookUrl,{method:'POST',mode:'no-cors',body:JSON.stringify(payload)});});}catch(e){}
  }

  function deep(r){
    var T=(C.resultsPage||{}).titles||{}, o={};
    function list(a){return '<ul class="bullets">'+a.map(function(x){return '<li>'+esc(fill(x,r))+'</li>';}).join('')+'</ul>';}
    function box(key,title,body,cls){return '<div class="card dsec '+(cls||'')+'"><h3>'+esc(fill(T[key]||title,r))+'</h3>'+body+'</div>';}
    var a=[]; if(r.signs&&r.signs.length) a.push(box('signs',"You'll recognise this if...",list(r.signs)));
    if(r.strengths&&r.strengths.length) a.push(box('strengths',"What you're already doing well",list(r.strengths),'soft'));
    o.top=a.length?'<div class="duo'+(a.length<2?' one':'')+'">'+a.join('')+'</div>':'';
    o.why=r.why?box('why','Why this keeps happening','<p>'+esc(fill(r.why,r))+'</p>','wide'):'';
    o.qw=r.quickWin?'<div class="qw"><span class="eyebrow">'+esc(fill(T.quickWin||'Start here',r))+(r.quickWin.time?' · '+esc(r.quickWin.time):'')+'</span><h3>'+esc(fill(r.quickWin.title,r))+'</h3><p>'+esc(fill(r.quickWin.text,r))+'</p></div>':'';
    var b=[]; if(r.avoid&&r.avoid.length) b.push(box('avoid','What to avoid',list(r.avoid),'soft'));
    if(r.outcome) b.push(box('outcome','What changes when you get this right','<p>'+esc(fill(r.outcome,r))+'</p>'));
    o.end=b.length?'<div class="duo'+(b.length<2?' one':'')+'">'+b.join('')+'</div>':'';
    return o;
  }
  function portraitResults(justSent){
    clearTimeout(state.timer);
    var P=C.portrait, r=C.results[state.result], f=C.resultsPage||{}, IC=C.icons||{}, A=state.answers||[];
    var nm=state.name?esc(state.name):'';
    function ic(k){return '<span class="pt-ic">'+(IC[k]||'')+'</span>';}
    var L=P.lens[A[0]]||P.lens[0];
    var chips=[];
    var q0=Q[0].options[A[0]]; if(q0) chips.push([q0.icon,q0.text]);
    var sh=P.share[A[2]]; if(sh) chips.push([Q[2].options[A[2]].icon,sh]);
    var sp=P.support[A[3]]; if(sp) chips.push([Q[3].options[A[3]].icon,sp[0]]);
    var tm=P.time[A[6]]; if(tm) chips.push([Q[6].options[A[6]].icon,tm]);
    var ap=P.approach[A[4]]; if(ap) chips.push([Q[4].options[A[4]].icon,ap]);
    var qw=r.quickWin||{}, picks=state.picks||[];
    var steps=picks.filter(function(x){return /^\d$/.test(String(x.n));}), extras=picks.filter(function(x){return !/^\d$/.test(String(x.n));});
    var G2=C.grownups||{}, nx=r.nextStep||C.offer, QA=C.questApp;
    var qaHref=QA?QA.url+'?r='+state.result+'&a='+A.map(function(x,qi){return Q[qi]&&Q[qi].private?9:x;}).join(''):'';
    view('results');
    app.innerHTML = bar()+
      (justSent?'<div class="sent" role="status"><span aria-hidden="true">&#10003;</span><span>'+esc(f.sentNote||'')+'</span></div>':'')+
      '<section class="pt-hero"><div class="pt-art">'+(IC[P.resultArt[state.result]]||'')+'</div><div><span class="eyebrow">'+(nm?nm+', here’s':'Here’s')+' the teen you described</span><h1 class="result-name">'+esc(r.name)+'</h1><p class="pt-sum">'+esc(r.summary)+'</p></div></section>'+
      '<section class="pt-lens" aria-label="What you see and what we see"><div class="pt-see"><span>You see</span><b>'+esc(L.see)+'</b></div><div class="pt-arrow" aria-hidden="true">→</div><div class="pt-we"><span>We see</span><b>'+esc(L.we)+'</b></div></section>'+
      '<section class="pt-sec"><h3>Who you described</h3><div class="pt-chips">'+chips.map(function(c){return '<span class="pt-chip">'+ic(c[0])+esc(c[1])+'</span>';}).join('')+'</div>'+(sp?'<p class="pt-note"><b>'+esc(sp[0])+':</b> '+esc(sp[1])+'</p>':'')+'</section>'+
      '<section class="pt-sec"><h3>Their future-ready superpowers</h3><div class="pt-powers">'+L.powers.map(function(p){return '<div class="pt-power">'+ic(p[0])+'<b>'+esc(p[1])+'</b><span>'+esc(p[2])+'</span></div>';}).join('')+'</div></section>'+
      '<section class="pt-tonight"><span class="eyebrow">Tonight · '+esc(qw.time||'')+'</span><h2>'+esc(qw.title||'')+'</h2><p>'+esc(qw.text||'')+'</p></section>'+
      '<section class="pt-sec"><h3>Their quest</h3><ol class="pt-path"><li class="done"><span>1</span><b>'+esc((qw.title||'').replace(/^Mission 1:\s*/,''))+'</b><em>tonight</em></li>'+steps.map(function(s){return '<li><span>'+esc(s.n)+'</span><details><summary><b>'+esc(s.title)+'</b></summary><p>'+esc(s.text)+'</p></details></li>';}).join('')+'</ol>'+
        extras.map(function(s){return '<details class="pt-more"><summary>'+esc(s.title)+'</summary><p>'+esc(s.text)+'</p></details>';}).join('')+'</section>'+
      (QA?'<section class="pt-app"><div class="pt-appart">'+(IC.rocket||IC.game||'')+'</div><div><span class="eyebrow">'+esc(QA.eyebrow||'')+'</span><h2>'+esc(QA.title)+'</h2><p>'+esc(QA.text)+'</p><a class="btn" style="width:auto;display:inline-flex" href="'+esc(qaHref)+'" onclick="try{localStorage.setItem(\'rebels-quest-handoff\',\''+state.result+':'+A.map(function(x,qi){return Q[qi]&&Q[qi].private?9:x;}).join('')+'\')}catch(e){}">'+esc(QA.button)+'</a></div></section>':'')+
      '<section class="pt-two"><div class="pt-do"><h3>✓ Lean into</h3><ul>'+(r.strengths||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div><div class="pt-dont"><h3>✕ Avoid</h3><ul>'+(r.avoid||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div></section>'+
      '<details class="pt-more"><summary>Why this keeps happening</summary><p>'+esc(r.why||'')+'</p><p>'+esc(r.insight||'')+'</p></details>'+
      (G2.questions?'<section class="pt-sec"><h3>Ask, listen, don’t fix</h3><p class="pt-note">Six questions for dinner, the car or a walk. Swipe →</p><div class="pt-cards">'+G2.questions.map(function(x,i){return '<div class="pt-card"><span>'+(i+1)+'</span>'+esc(x)+'</div>';}).join('')+'</div></section>':'')+
      (nx?'<div class="bridge"><p>'+esc(r.bridge||'')+'</p></div><div class="offer"><div class="o-text"><span class="eyebrow">'+esc(nx.eyebrow)+'</span><h2>'+esc(nx.title)+'</h2><p style="margin-top:10px">'+esc(nx.text)+'</p></div><div class="o-act"><a class="btn" href="'+esc(nx.url||'#')+'"'+(nx.url?'':' data-soon="1"')+'>'+esc(nx.button)+'</a>'+(nx.note?'<p class="small" style="margin-top:10px">'+esc(nx.note)+'</p>':'')+'</div></div>':'')+
      (G2.cohort?'<section class="pt-cohort"><span class="eyebrow">'+esc(G2.cohort.eyebrow)+'</span><h3>'+esc(G2.cohort.title)+'</h3><p>'+esc(G2.cohort.text)+'</p><a class="btn ghost" style="width:auto;display:inline-flex" href="'+esc(G2.cohort.url)+'">'+esc(G2.cohort.button)+'</a></section>':'')+
      '<div class="r-foot">'+(f.storyTitle?'<div class="section r-story"><h3>'+esc(f.storyTitle)+'</h3><p style="margin-top:8px">'+esc(f.story)+'</p></div>':'')+
      (f.followUrl?'<div class="r-follow"><a class="btn ghost" href="'+esc(f.followUrl)+'" target="_blank" rel="noopener">'+esc(f.followText||'Follow')+'</a></div>':'')+'</div>'+
      '<button class="back" id="again">'+esc(C.app.againText||'Take it again')+'</button>'+disclaimer();
    var soon=app.querySelector('[data-soon]'); if(soon) soon.onclick=function(e){e.preventDefault();soon.textContent='Link coming soon';};
    document.getElementById('again').onclick=function(){state.score=null;state.areas=null;welcome();};
    top();
  }
  function results(justSent){
    if(C.portrait) return portraitResults(justSent);
    clearTimeout(state.timer);
    var r=C.results[state.result], f=C.resultsPage||{}, n=state.name?esc(state.name)+', ':'';
    var nx=r.nextStep||C.offer;
    var main = '';
    if(CALC){ main += '<div class="card section"><h3>'+esc(fill(C.teaser.numbersTitle||'Your numbers',r))+'</h3>'+numbers(C.outputs||[])+'</div>'; if(r.steps&&r.steps.length) main += '<div class="card section"><h3>'+esc(fill(C.teaser.lockedTitle,r))+'</h3>'+stepList(r.steps)+'</div>'; }
    else if(GEN){ main += '<div class="card section"><h3>'+esc(fill((C.generate||{}).title||C.teaser.lockedTitle,r))+'</h3>'+stepList(state.picks)+'</div>'; if(C.questApp){ var QA=C.questApp; main += '<div class="card section" style="border:2px solid var(--action)"><p class="eyebrow">'+esc(QA.eyebrow||'')+'</p><h3>'+esc(QA.title)+'</h3><p>'+esc(QA.text)+'</p><p><a class="btn" style="display:inline-block;text-decoration:none" href="'+esc(QA.url+'?r='+state.result+'&a='+state.answers.join(''))+'" onclick="try{localStorage.setItem(\'rebels-quest-handoff\',\''+state.result+':'+state.answers.join('')+'\')}catch(e){}">'+esc(QA.button)+'</a></p></div>'; } if(C.grownups){ var G2=C.grownups; main += '<div class="gu"><h3>'+esc(G2.title)+'</h3><p>'+esc(G2.text)+'</p><ol>'+G2.questions.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol><p class="small">'+esc(G2.avoid)+'</p>'+(G2.cohort?'<div class="cohort"><p class="eyebrow">'+esc(G2.cohort.eyebrow)+'</p><h3>'+esc(G2.cohort.title)+'</h3><p>'+esc(G2.cohort.text)+'</p><a class="btn" style="display:inline-flex;width:auto;text-decoration:none" href="'+esc(G2.cohort.url)+'">'+esc(G2.cohort.button)+'</a></div>':'')+'</div>'; } if(r.steps&&r.steps.length) main += '<div class="card section"><h3>'+esc(fill(C.teaser.stepsTitle||'Your next steps',r))+'</h3>'+stepList(r.steps)+'</div>'; }
    else main = '<div class="card section"><h3>'+esc(fill(C.teaser.lockedTitle,r))+'</h3>'+stepList(r.steps||[])+'</div>';
    view('results');
    var dp=deep(r);
    app.innerHTML = bar()+
      (justSent?'<div class="sent" role="status"><span aria-hidden="true">&#10003;</span><span>'+esc(f.sentNote||'Your results are on their way to your inbox too.')+'</span></div>':'')+
      '<div class="r-hero">'+resultHead(r,'r-head')+'<div class="r-ins"><p class="insight">'+n+esc(fill(r.insight,r))+'</p>'+areaBars()+'</div></div>'+
      dp.top+dp.why+dp.qw+
      '<div class="r-main">'+main+'</div>'+dp.end+
      ((C.resultsPage||{}).saveText!==''?'<button class="btn ghost save" id="save" type="button">'+esc((C.resultsPage||{}).saveText||'Save my plan')+'</button>':'')+
      (nx?'<div class="bridge">'+((r.bridge||nx.bridge)?'<p>'+esc(fill(r.bridge||nx.bridge,r))+'</p>':'')+'</div>'+
        '<div class="offer"><div class="o-text"><span class="eyebrow">'+esc(nx.eyebrow)+'</span><h2>'+esc(fill(nx.title,r))+'</h2><p style="margin-top:10px">'+esc(fill(nx.text,r))+'</p></div><div class="o-act"><a class="btn" href="'+esc(nx.url||'#')+'"'+(nx.url?'':' data-soon="1"')+'>'+esc(nx.button)+'</a>'+(nx.note?'<p class="small" style="margin-top:10px">'+esc(nx.note)+'</p>':'')+'</div></div>':'')+
      '<div class="r-foot">'+(f.storyTitle?'<div class="section r-story"><h3>'+esc(f.storyTitle)+'</h3><p style="margin-top:8px">'+esc(f.story)+'</p></div>':'')+
      (f.followUrl?'<div class="r-follow"><a class="btn ghost" href="'+esc(f.followUrl)+'" target="_blank" rel="noopener">'+esc(f.followText||'Follow me on Instagram')+'</a></div>':'')+'</div>'+
      '<button class="back" id="again">'+esc(C.app.againText||'Take it again')+'</button>'+disclaimer();
    var sv=document.getElementById('save'); if(sv) sv.onclick=function(){window.print();};
    var soon=app.querySelector('[data-soon]'); if(soon) soon.onclick=function(e){e.preventDefault();soon.textContent='Link coming soon';};
    document.getElementById('again').onclick=function(){state.score=null;state.areas=null;welcome();};
    top();
  }

  /* ---------- preview tools ---------- */
  function fake(k){
    state.answers=Q.map(function(){return 0;});
    if(CALC){ state.vals={}; Q.forEach(function(q){ state.vals[q.key] = q.options ? q.options[0].value : (q['default']!=null?q['default']:0); }); compute(); }
    state.result=k;
    if(T==='assessment'){var b=(C.bands||[]).filter(function(x){return x.key===k;})[0]||{min:50,max:50};state.score=Math.round((b.min+b.max)/2);
      state.areas={};(C.areas||[]).forEach(function(a,ix){state.areas[a.key]={name:a.name,got:Math.max(10,state.score-15+ix*10),max:100};});}
    if(GEN){ var ks=Object.keys(C.results); state.answers=Q.map(function(q){ var ix=-1; q.options.forEach(function(o,j){ if(ix<0&&o.result===k) ix=j; }); return ix<0?0:ix; }); pick(); }
  }
  function jumpMenu(){
    var d=document.createElement('div'); d.className='jump';
    var keys=Object.keys(C.results);
    d.innerHTML='<b>Jump to screen</b><button data-s="w">Welcome</button><button data-s="q">'+(CALC?'Step':'Question')+' 1</button>'+
      keys.map(function(k){return '<button data-s="b'+k+'">Building: '+esc(C.results[k].name)+'</button><button data-s="t'+k+'">Teaser: '+esc(C.results[k].name)+'</button><button data-s="r'+k+'">Results: '+esc(C.results[k].name)+'</button>';}).join('');
    d.onclick=function(e){var s=e.target.getAttribute('data-s'); if(!s) return;
      clearTimeout(state.timer);
      if(s==='w') return welcome(); if(s==='q'){state.i=0;state.answers=[];state.vals={};return question();}
      fake(s.slice(1)); if(s[0]==='b') building(); else if(s[0]==='t') teaser(); else results(false);};
    document.body.appendChild(d);
  }

  /* ---------- start ---------- */
  var direct=params.get('r');
  if(direct&&C.results[direct]){
    state.name=params.get('name')||read('fa_name')||'';
    if(CALC && params.get('v')){ params.get('v').split(',').forEach(function(p){var kv=p.split(':'); if(kv[0]) state.vals[kv[0]]=parseFloat(kv[1]);}); compute(); }
    else if(CALC){ fake(direct); }
    if(GEN){ var a=params.get('a'); if(a&&a.length===Q.length){ state.answers=a.split('').map(Number); state.result=direct; pick(); } else fake(direct); }
    state.result=direct;
    if(T==='assessment'){ var sc=params.get('s')||read('fa_score'); if(sc) state.score=+sc; }
    results(false);
  }
  else welcome();
  if(params.get('preview')==='1') jumpMenu();
})();
</script>
<script>(function(){function fix(){document.querySelectorAll('.opts.icons').forEach(function(g){var n=g.children.length,w=g.clientWidth||360,c;if(w>=640){c=n<=5?n:(n%4===0?4:3);}else{c=(n===2||n===4||n===8)?2:(n===1?1:3);}g.style.gridTemplateColumns='repeat('+c+',minmax(0,1fr))';g.style.fontSize=(c>=3&&w<640)?'14px':'';});}var a=document.getElementById('app');if(a)new MutationObserver(fix).observe(a,{childList:true});window.addEventListener('resize',fix);})();</script>
</body>
</html>
