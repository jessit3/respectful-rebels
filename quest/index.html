<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rebel Quest · Respectful Rebels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE warm, cheeky, never school-like
   IDEA a board game you play with your own life: tiles, a board, a piece, a map
   PICTURE every choice is an illustration; the chessboard; the quest map
   COLOUR warm ground, deep teal board, lavender tiles, pop violet for wins
   TYPE Montserrat 800 for game words, Nunito for everything else
   LAYOUT one decision per screen, big tap targets, progress dots + XP always visible */
:root{--bg:#FAF8F6;--panel:#ded2eb;--accent:#b3c9f1;--action:#037A8C;--teal:#05ABC4;--pop:#b180bd;--ink:#3c2415;--line:#e9e0d7;--sq1:#f1ebe4;--sq2:#d9ccdf}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Montserrat,system-ui,sans-serif;line-height:1.1;margin:0 0 .35em;text-wrap:balance}
h1{font-size:clamp(28px,6vw,40px);font-weight:900}h2{font-size:clamp(22px,4.6vw,30px);font-weight:800}h3{font-size:18px;font-weight:800}
.wrap{max-width:820px;margin:0 auto;padding:14px 16px 90px}
.hud{display:flex;align-items:center;gap:10px;justify-content:space-between;font:800 13px Montserrat,sans-serif;padding:6px 0 12px}
.hud .xp{background:var(--ink);color:#fff;border-radius:999px;padding:5px 12px}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:#e4dbd1}.dots i.on{background:var(--teal)}.dots i.now{background:var(--pop);transform:scale(1.3)}
.lock{font-size:13px;color:#6a5446;background:#fff;border:1px dashed #cdbfb3;border-radius:12px;padding:8px 12px;margin:8px 0 14px}
.sub{font-size:16px;color:#5b4637;margin:0 0 14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;background:#fff;border:2px solid var(--line);border-radius:20px;padding:12px 10px 12px;text-align:center;cursor:pointer;font:700 15px Nunito,sans-serif;color:var(--ink);min-height:44px;transition:transform .15s,border-color .15s}
.tile svg{width:100%;height:auto;max-height:110px;display:block;margin:0 auto 6px}
.tile[aria-pressed=true]{border-color:var(--action);background:#eef7f8;transform:translateY(-3px)}
.tile[aria-pressed=true]::after{content:"\2713";position:absolute;top:8px;right:10px;background:var(--action);color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:15px}
.tile small{display:block;font-weight:600;color:#6a5446;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--action);color:#fff;border:0;border-radius:16px;padding:14px 22px;font:800 17px Nunito,sans-serif;cursor:pointer;min-height:48px}
.btn:disabled{opacity:.45;cursor:default}
.ghost{background:transparent;color:var(--ink);border:2px solid var(--action);border-radius:14px;padding:9px 14px;font:700 15px Nunito,sans-serif;cursor:pointer;min-height:44px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--pop);outline-offset:3px}
input[type=text],textarea{width:100%;font:16px Nunito,sans-serif;color:var(--ink);border:2px solid #cdbfb3;border-radius:14px;padding:12px;background:#fff}
/* chessboard */
.boardwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media(min-width:700px){.boardwrap{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}}
.board{position:relative;aspect-ratio:1;width:100%;max-width:460px;border-radius:18px;overflow:hidden;touch-action:none;box-shadow:0 0 0 6px var(--ink);margin:6px auto}
.board .sq{position:absolute;width:12.5%;height:12.5%}
.corner{position:absolute;width:30%;display:flex;flex-direction:column;align-items:center;pointer-events:none;font:800 13px Montserrat,sans-serif;text-align:center}
.corner svg{width:58%;height:auto;filter:drop-shadow(0 2px 0 rgba(60,36,21,.2))}
.corner span{background:#fff;border-radius:999px;padding:2px 8px;margin-top:2px}
.piece{position:absolute;width:13%;aspect-ratio:1;transform:translate(-50%,-62%);cursor:grab;touch-action:none;z-index:3}
.piece svg{width:100%;height:auto;filter:drop-shadow(0 6px 4px rgba(60,36,21,.35))}
.bars .row{display:grid;grid-template-columns:92px minmax(0,1fr) 44px;gap:8px;align-items:center;font-weight:700;font-size:15px;margin:6px 0}
.bars .track{background:#eee6de;border-radius:8px;height:14px;overflow:hidden}.bars .fill{height:100%;background:var(--teal);border-radius:8px}
/* map */
.map{position:relative;background:linear-gradient(160deg,#e9f4f6,#f1e9f6);border-radius:24px;padding:10px;margin:8px 0 14px}
.map svg{width:100%;height:auto;display:block}
.node{cursor:pointer}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}
.moves{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}
.move{background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:12px;text-align:left;cursor:pointer;font:600 15px/1.45 Nunito,sans-serif;color:var(--ink)}
.move svg{width:44px;height:44px;display:block;margin-bottom:6px}
.move b{display:block;font:800 16px Montserrat,sans-serif;margin-bottom:2px}
.move[aria-pressed=true]{border-color:var(--action);background:#eef7f8}
.tip{display:flex;gap:8px;align-items:flex-start;font-size:15px;background:#f6f0fa;border-radius:12px;padding:8px 10px;margin:6px 0}
.tip svg{width:26px;height:26px;flex:none}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border-radius:999px;padding:4px 12px;font:800 13px Montserrat,sans-serif}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge.off{background:#eee6de;color:#9a8574}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scroll-snap-type:x mandatory}
.tabs button{flex:none;scroll-snap-align:start;border:2px solid var(--action);background:#fff;color:var(--ink);border-radius:999px;padding:8px 14px;font:800 14px Nunito,sans-serif;cursor:pointer;min-height:44px}
.tabs button[aria-selected=true]{background:var(--action);color:#fff}
.compass{background:var(--ink);color:#fff;border-radius:24px;padding:20px;display:grid;gap:12px}
@media(min-width:640px){.compass{grid-template-columns:160px minmax(0,1fr);align-items:center}}
.compass svg{width:140px;height:140px;margin:auto}
.compass .eyebrow{font:800 12px Montserrat,sans-serif;letter-spacing:.08em;color:var(--accent)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--pop);color:#fff;font:800 16px Montserrat,sans-serif;border-radius:999px;padding:12px 20px;box-shadow:0 8px 24px rgba(60,36,21,.25);z-index:9;animation:pop .5s ease}
@keyframes pop{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.offer{background:var(--action);color:#fff;border-radius:20px;padding:20px;margin:16px 0}
.offer a{display:inline-block;background:#fff;color:var(--action);font-weight:800;border-radius:12px;padding:10px 16px;text-decoration:none;margin-top:8px}
pre{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;max-height:300px;overflow:auto}
.note{font-size:14px;color:#6a5446}
.inrow{display:flex;gap:8px;align-items:stretch}.inrow>input,.inrow>textarea{flex:1}
.mic{flex:none;width:56px;border:2px solid var(--action);background:#fff;border-radius:14px;cursor:pointer;padding:6px}.mic svg{width:100%;height:auto}.mic.on{background:var(--pop);border-color:var(--pop)}
.hint{font-size:13px;color:#6a5446;margin:4px 0 0}
.tiles.c3 .tile{font-size:14px;padding:10px 6px}.tiles.c3 .tile small{font-size:12px}
.ranks{display:grid;gap:8px}.rank{display:flex;gap:10px;align-items:center;border-radius:14px;padding:10px 12px;background:#fff;border:1px solid var(--line)}.rank.off{opacity:.55}.rank b{font-family:Montserrat,sans-serif}
.lvlbar{height:12px;background:#eee6de;border-radius:8px;overflow:hidden;margin:8px 0}.lvlbar i{display:block;height:100%;background:var(--pop)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function checkin(){
  var h=hud()+'<h1>Hey Rebel. How much time do you have right now?</h1><p class="sub">You choose. Every amount counts, even one minute.</p><div class="tiles">'+MODES.map(function(m){return tile(m[0],ART[m[1]],m[2],m[3],(window.__mode||'')===m[0],'mode');}).join('')+'</div>';
  if(window.__mode==='deep')h+='<p style="margin-top:14px"><b>How long is your deep dive?</b></p><div style="display:flex;gap:8px;flex-wrap:wrap">'+[15,25,45,60].map(function(n){var on=(window.__mins||25)===n;return '<button class="ghost" data-mins="'+n+'" aria-pressed="'+on+'" style="'+(on?'background:var(--action);color:#fff':'')+'">'+n+' min</button>';}).join('')+'</div>';
  h+='<div class="foot"><span class="note">Your timer starts when you tap Go.</span><button class="btn" id="go" '+(window.__mode?'':'disabled')+'>Go →</button></div>';
  app.innerHTML=h;
  app.querySelectorAll('.tile').forEach(function(t){t.onclick=function(){window.__mode=t.dataset.v;checkin();};});
  app.querySelectorAll('[data-mins]').forEach(function(b){b.onclick=function(){window.__mins=+b.dataset.mins;checkin();};});
  document.getElementById('go').onclick=function(){var m=MODES.filter(function(x){return x[0]===window.__mode;})[0];setSess({mode:m[0],mins:m[0]==='deep'?(window.__mins||25):m[4],start:Date.now(),ext:0});if(m[0]==='deep')S.tab='map';save();render();tick();};
}
function left(){if(!SESS||!SESS.mins)return null;return Math.round(SESS.mins*60+SESS.ext*60-(Date.now()-SESS.start)/1000);}
function fmtT(s){s=Math.max(0,s);return Math.floor(s/60)+':'+('0'+s%60).slice(-2);}
var timerOn=false;
function tick(){if(timerOn)return;timerOn=true;setInterval(function(){var el=document.getElementById('timer');var l=left();if(l==null)return;if(el)el.textContent='⏱ '+fmtT(l);if(l<=0&&!SESS.rang){SESS.rang=true;setSess(SESS);timeUp();}},1000);}
function timeUp(){var d=document.createElement('div');d.className='toast';d.style.animation='none';d.innerHTML='Time’s up! <button class="ghost" id="more" style="background:#fff;margin-left:8px">+5 min</button> <button class="ghost" id="stop" style="background:#fff">Stop here</button>';document.body.appendChild(d);say('Time is up. Add 5 minutes or stop here.');
  document.getElementById('more').onclick=function(){SESS.ext+=5;SESS.rang=false;setSess(SESS);d.remove();};
  document.getElementById('stop').onclick=function(){d.remove();endSess();};}
function endSess(){if(!SESS)return;var used=Math.max(1,Math.round((Date.now()-SESS.start)/60000)),planned=(SESS.mins||used)+SESS.ext;S.sessions.push({date:new Date().toISOString().slice(0,10),mode:SESS.mode,planned:planned,used:used});S.xp+=SESS.mode==='quick'?5:SESS.mode==='jot'?10:0;save();setSess(null);window.__mode=null;render();toast('Session saved: planned '+planned+' min, used '+used+'.');}
function nextIdx(){for(var i=0;i<6;i++)if(!S.done[i])return i;return 5;}
function quickView(){var m=missions()[nextIdx()];
  return '<div class="card"><h2>Quick check-in</h2><p>How’s your project feeling today?</p><div class="tiles">'+[['face_spark','Excited'],['face_ok','Okay'],['face_stuck','Stuck'],['energy','Tired']].map(function(f){return tile(f[0],ART[f[0]],f[1],'',SESS.feel===f[0],'feelnow');}).join('')+'</div><p style="margin-top:14px"><b>Up next:</b> Mission '+(nextIdx()+1)+', '+esc(m.t)+'</p>'+(SESS.feel==='face_stuck'?'<div class="tip">'+ART.noidea+'<span>Stuck is normal. Next time, pick “A few minutes” and jot just one thing.</span></div>':'')+'<div class="foot"><span></span><button class="btn" id="end" '+(SESS.feel?'':'disabled')+'>Done ✓ +5 XP</button></div></div>';}
function jotView(){var m=missions()[nextIdx()];
  return '<div class="card"><h2>Jot it down</h2><p class="note">For Mission '+(nextIdx()+1)+': '+esc(m.t)+'</p><p>'+esc(m.p)+'</p><span class="inrow"><textarea id="jot" maxlength="400" rows="4" placeholder="Messy is perfect. Any language counts.">'+esc(SESS.text||'')+'</textarea>'+mic('jot')+'</span>'+VOICEHINT+'<div class="foot"><button class="ghost" id="todeep">Make it a deep dive</button><button class="btn" id="end">Save my jot +10 XP</button></div></div>'+
   (S.jots.length?'<div class="card"><h3>Your jots</h3>'+S.jots.slice(-5).reverse().map(function(j){return '<p style="margin:6px 0"><span class="note">'+esc(j.date)+'</span><br>'+esc(j.text)+'</p>';}).join('')+'</div>':'');}
function sessionsCard(){if(!S.sessions.length)return '';var tot=S.sessions.reduce(function(a,s){return a+s.used;},0),on=S.sessions.filter(function(s){return s.used<=s.planned+2;}).length;
  return '<div class="card"><h3>My time</h3><p><b>'+S.sessions.length+' sessions · '+tot+' minutes</b> · finished on time '+on+' of '+S.sessions.length+'</p>'+S.sessions.slice(-6).reverse().map(function(s){return '<p class="note" style="margin:2px 0">'+esc(s.date)+' · '+({quick:'Check-in',jot:'Jot',deep:'Deep dive'})[s.mode]+' · planned '+s.planned+' min, used '+s.used+'</p>';}).join('')+'</div>';}
function render(){
  if(LIB)return libView();
  if(!S.setup)return setup();
  if(!SESS)return checkin();
  if(SESS.mode!=='deep'){app.innerHTML=hud()+(SESS.mode==='quick'?quickView():jotView());
    var he0=document.getElementById('hudend');if(he0)he0.onclick=endSess;
    app.querySelectorAll('[data-g=feelnow]').forEach(function(t){t.onclick=function(){SESS.feel=t.dataset.v;setSess(SESS);render();};});
    var j=document.getElementById('jot');if(j)j.oninput=function(){SESS.text=j.value;setSess(SESS);};
    var td=document.getElementById('todeep');if(td)td.onclick=function(){if(SESS.text&&SESS.text.trim())S.jots.push({date:new Date().toISOString().slice(0,10),text:SESS.text.trim()});SESS.mode='deep';SESS.mins=25;SESS.start=Date.now();SESS.ext=0;SESS.rang=false;SESS.text='';setSess(SESS);S.tab='map';save();render();};
    document.getElementById('end').onclick=function(){if(SESS.mode==='jot'&&SESS.text&&SESS.text.trim())S.jots.push({date:new Date().toISOString().slice(0,10),text:SESS.text.trim()});endSess();};
    bindMics();tick();return;}

  var body={compass:compass,map:quest,record:record,remix:remix}[S.tab]||quest;
  app.innerHTML=hud()+tabs()+body();tick();
  app.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){S.tab=b.dataset.tab;save();render();window.scrollTo(0,0);};});
  app.querySelectorAll('[data-open]').forEach(function(g){var f=function(){S.open=+g.dataset.open;save();render();};g.onclick=f;g.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();f();}};});
  app.querySelectorAll('[data-move]').forEach(function(b){b.onclick=function(){S.move[S.open]=+b.dataset.move;save();render();var p=document.getElementById('proof');if(p)p.focus();};});
  app.querySelectorAll('[data-feel]').forEach(function(b){b.onclick=function(){S.feel[S.open]=b.dataset.feel;save();render();toast(b.dataset.feel==='right'?'Noted. Keep going!':'Noted for your remix');};});
  var pr=document.getElementById('proof');if(pr)pr.oninput=function(){S.proof[S.open]=pr.value;save();};
  var did=document.getElementById('did');if(did)did.onclick=function(){var i=S.open;S.done[i]=new Date().toISOString().slice(0,10);S.xp+=30;if(i<5)S.open=i+1;save();render();toast('★ '+BADGES[i]+' badge · +30 XP');};
  app.querySelectorAll('[data-undo]').forEach(function(b){b.onclick=function(){delete S.done[+b.dataset.undo];S.xp=Math.max(0,S.xp-30);save();render();};});
  bindMics();
  var xc=document.getElementById('xpchip');if(xc)xc.onclick=function(){S.tab='compass';save();render();setTimeout(function(){var c=[].slice.call(app.querySelectorAll('h2')).filter(function(h){return /XP/.test(h.textContent);})[0];if(c)c.scrollIntoView();},50);};
  var cc=document.getElementById('copycard');if(cc)cc.onclick=function(){copy(window.__card,cc);};
  var he=document.getElementById('hudend');if(he)he.onclick=endSess;
  var rd=document.getElementById('redo');if(rd)rd.onclick=function(){S.setup=false;S.step=0;save();render();};
  var cr=document.getElementById('copyrec');if(cr)cr.onclick=function(){copy(app.querySelector('.card').innerText,cr);};
  var cp=document.getElementById('copypr');if(cp)cp.onclick=function(){copy(promptText(),cp);};
  var qc=document.getElementById('qcode');if(qc)qc.onclick=function(){var d={v:2,start:S.start,interests:S.interests,pos:S.pos,annoy:S.annoy,own:S.own,help:S.help,strug:S.strug,work:S.work,done:S.done,move:S.move,proof:S.proof,feel:S.feel};copy('REBELQUEST:'+btoa(unescape(encodeURIComponent(JSON.stringify(d)))),qc);};
  var rs=document.getElementById('reset');if(rs)rs.onclick=function(){if(rs.dataset.sure){try{localStorage.removeItem(KEY);}catch(e){}S=blank();render();}else{rs.dataset.sure=1;rs.textContent='Tap again to erase everything';}};
}
function copy(t,btn){var ok=function(){btn.textContent='Copied ✓';};try{navigator.clipboard.writeText(t).then(ok,function(){fb(t);ok();});}catch(e){fb(t);ok();}}
function fb(t){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');}catch(e){}a.remove();}
render();
}
</script>
</body>
</html>
